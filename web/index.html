  <head>

    <meta name="color-scheme" content="light dark" />
    <title>memode</title>

          <rect x="7.5" y="8.5" width="9" height="7" rx="1.2" fill="currentColor" stroke="none" />
        </svg>
      </span>
      <span id="status-language" class="clickable" title="言語を選ぶ"></span>
      <span id="status-version"></span>
    </div>
